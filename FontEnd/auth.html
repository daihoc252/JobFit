<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký – JobFit</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f4ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 420px;
        padding: 40px 36px;
      }

      .logo {
        text-align: center;
        margin-bottom: 24px;
      }

      .logo h1 {
        font-size: 28px;
        color: #4f46e5;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .logo p {
        color: #888;
        font-size: 14px;
        margin-top: 4px;
      }

      /* Tab */
      .tabs {
        display: flex;
        border-bottom: 2px solid #e5e7eb;
        margin-bottom: 28px;
      }

      .tab {
        flex: 1;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        font-weight: 600;
        color: #9ca3af;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
      }

      .tab.active {
        color: #4f46e5;
        border-bottom-color: #4f46e5;
      }

      /* Form */
      .form {
        display: none;
      }
      .form.active {
        display: block;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
      }

      input,
      select {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #e5e7eb;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border 0.2s;
      }

      input:focus,
      select:focus {
        border-color: #4f46e5;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s;
      }

      .btn:hover {
        background: #4338ca;
      }
      .btn:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
      }

      .msg {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }

      .msg.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
      }
      .msg.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>JobFit</h1>
        <p>Tìm việc thông minh, phù hợp hơn</p>
      </div>

      <!-- Tab -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
        <div class="tab" onclick="switchTab('register')">Đăng ký</div>
      </div>

      <!-- Form đăng nhập -->
      <div class="form active" id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="example@email.com"
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            placeholder="Nhập mật khẩu"
          />
        </div>
        <button class="btn" onclick="handleLogin()">Đăng nhập</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- Form đăng ký -->
      <div class="form" id="form-register">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="reg-name" placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="example@email.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="reg-password"
            placeholder="Tối thiểu 6 ký tự"
          />
        </div>
        <div class="form-group">
          <label>Bạn là</label>
          <select id="reg-role">
            <option value="candidate">Ứng viên tìm việc</option>
            <option value="employer">Nhà tuyển dụng</option>
          </select>
        </div>
        <button class="btn" onclick="handleRegister()">Đăng ký</button>
        <div class="msg" id="reg-msg"></div>
      </div>
    </div>

    <script>
      const API = "http://localhost:3000/api";

      // ── Chuyển tab ──────────────────────────────────────────
      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".form")
          .forEach((f) => f.classList.remove("active"));

        if (tab === "login") {
          document.querySelectorAll(".tab")[0].classList.add("active");
          document.getElementById("form-login").classList.add("active");
        } else {
          document.querySelectorAll(".tab")[1].classList.add("active");
          document.getElementById("form-register").classList.add("active");
        }
      }

      // ── Hiện thông báo ──────────────────────────────────────
      function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `msg ${type}`;
      }

      // ── Đăng nhập ───────────────────────────────────────────
      async function handleLogin() {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        if (!email || !password) {
          return showMsg(
            "login-msg",
            "Vui lòng nhập đầy đủ thông tin!",
            "error",
          );
        }

        const btn = document.querySelector("#form-login .btn");
        btn.disabled = true;
        btn.textContent = "Đang xử lý...";

        try {
          const res = await fetch(`${API}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            // Lưu token và thông tin user vào localStorage
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            showMsg(
              "login-msg",
              "Đăng nhập thành công! Đang chuyển hướng...",
              "success",
            );

            // Chuyển hướng theo role
            setTimeout(() => {
              if (data.user.role === "employer") {
                window.location.href = "dashboard.html";
              } else {
                window.location.href = "index.html";
              }
            }, 1000);
          } else {
            showMsg(
              "login-msg",
              data.message || "Đăng nhập thất bại!",
              "error",
            );
          }
        } catch (err) {
          showMsg("login-msg", "Không kết nối được server!", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Đăng nhập";
        }
      }

      // ── Đăng ký ─────────────────────────────────────────────
      async function handleRegister() {
        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const role = document.getElementById("reg-role").value;

        if (!name || !email || !password) {
          return showMsg("reg-msg", "Vui lòng nhập đầy đủ thông tin!", "error");
        }

        if (password.length < 6) {
          return showMsg("reg-msg", "Mật khẩu tối thiểu 6 ký tự!", "error");
        }

        const btn = document.querySelector("#form-register .btn");
        btn.disabled = true;
        btn.textContent = "Đang xử lý...";

        try {
          const res = await fetch(`${API}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, role }),
          });

          const data = await res.json();

          if (res.ok) {
            showMsg(
              "reg-msg",
              "Đăng ký thành công! Vui lòng đăng nhập.",
              "success",
            );
            setTimeout(() => switchTab("login"), 1500);
          } else {
            showMsg("reg-msg", data.message || "Đăng ký thất bại!", "error");
          }
        } catch (err) {
          showMsg("reg-msg", "Không kết nối được server!", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Đăng ký";
        }
      }

      // ── Enter để submit ─────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const loginActive = document
            .getElementById("form-login")
            .classList.contains("active");
          if (loginActive) handleLogin();
          else handleRegister();
        }
      });
    </script>
  </body>
</html>
