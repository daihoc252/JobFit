<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký – JobFit</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>JobFit</h1>
        <p>Tìm việc thông minh, phù hợp hơn</p>
      </div>

      <!-- Tab -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
        <div class="tab" onclick="switchTab('register')">Đăng ký</div>
      </div>

      <!-- Form đăng nhập -->
      <div class="form active" id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="example@email.com"
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            placeholder="Nhập mật khẩu"
          />
        </div>
        <button class="btn" onclick="handleLogin()">Đăng nhập</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- Form đăng ký -->
      <div class="form" id="form-register">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="reg-name" placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="example@email.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="reg-password"
            placeholder="Tối thiểu 6 ký tự"
          />
        </div>
        <div class="form-group">
          <label>Bạn là</label>
          <select id="reg-role">
            <option value="candidate">Ứng viên tìm việc</option>
            <option value="employer">Nhà tuyển dụng</option>
          </select>
        </div>
        <button class="btn" onclick="handleRegister()">Đăng ký</button>
        <div class="msg" id="reg-msg"></div>
      </div>
    </div>
    <script src="../js/auth.js"></script>
  </body>
</html>
