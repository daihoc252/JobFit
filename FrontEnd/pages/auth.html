<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký – JobFit</title>
    <link rel="icon" type="image/x-icon" href="../assets/image/favicon.ico" />

    <link rel="stylesheet" href="../assets/css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>JobFit</h1>
        <p>Tìm việc thông minh, phù hợp hơn</p>
      </div>

      <!-- Tab -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
        <div class="tab" onclick="switchTab('register')">Đăng ký</div>
      </div>

      <!-- Form đăng nhập -->
      <div class="form active" id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="example@email.com"
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            placeholder="Nhập mật khẩu"
          />
        </div>
        <button class="btn" onclick="handleLogin()">Đăng nhập</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <!-- Form đăng ký -->
      <div class="form" id="form-register">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="reg-name" placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="example@email.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            id="reg-password"
            placeholder="Tối thiểu 6 ký tự"
          />
        </div>
        <div class="form-group">
          <label>Bạn là</label>
          <select id="reg-role">
            <option value="candidate">Ứng viên tìm việc</option>
            <option value="employer">Nhà tuyển dụng</option>
          </select>
        </div>
        <button class="btn" onclick="handleRegister()">Đăng ký</button>
        <div class="msg" id="reg-msg"></div>
      </div>

      <!-- Đăng nhập nhanh bằng mạng xã hội -->
      <div class="social-divider"><span>hoặc</span></div>

      <div class="social-role-pick">
        <p class="oauth-hint">Nếu là tài khoản mới, đăng ký với vai trò:</p>
        <label>
          <input type="radio" name="socialRole" value="candidate" checked />
          Ứng viên
        </label>
        <label>
          <input type="radio" name="socialRole" value="employer" />
          Nhà tuyển dụng
        </label>
      </div>

      <div class="social-login">
        <div id="googleBtn" class="google-btn-wrap"></div>
        <p id="googleNotConfigured" class="oauth-hint" style="display: none">
          Đăng nhập Google chưa được cấu hình
        </p>

        <button
          type="button"
          class="btn-facebook"
          id="fbLoginBtn"
          onclick="handleFacebookLogin()"
        >
          <i class="bi bi-facebook"></i>
          Đăng nhập với Facebook
        </button>
        <p id="facebookHttpsHint" class="oauth-hint" style="display: none">
          Facebook yêu cầu HTTPS — chỉ hoạt động khi trang được triển khai qua HTTPS
        </p>
      </div>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/oauth-config.js"></script>
    <script src="../assets/js/auth-page.js"></script>
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
      onload="initGoogleLogin()"
    ></script>
  </body>
</html>
